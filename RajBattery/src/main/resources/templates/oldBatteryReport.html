<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Table - Brand</title>
    <link rel="stylesheet" href="/assestad/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i&amp;display=swap">
    <style>
        body { margin: 0; }
        #wrapper { display: flex; min-height: 100vh; }
        #content-wrapper { flex: 1; min-width: 0; overflow-x: hidden; }
    </style>
    <link rel="stylesheet" href="/assestad/fonts/fontawesome-all.min.css">
    <link rel="stylesheet" href="/assestad/fonts/font-awesome.min.css">
    <link rel="stylesheet" href="/assestad/fonts/fontawesome5-overrides.min.css">
    <link rel="stylesheet" href="/assestad/css/Billing-Table-with-Add-Row--Fixed-Header-Feature.css">
    <link rel="stylesheet" href="/assestad/css/Company-Invoice.css">
    <link rel="stylesheet" href="/assestad/css/Ludens---Create-Edit-Form.css">
    <link rel="stylesheet" href="/assestad/css/Pretty-Login-Form-.css">
    <link rel="stylesheet" href="/assestad/css/select.css">
    <script src="/assestad/js/clock.js"></script>
    <script src="/assestad/js/filter.js"></script>
</head>

<body id="page-top">
    <div id="wrapper">
        <div th:replace="~{fragment1 ::adminfragment1}"></div>
        <div class="d-flex flex-column" id="content-wrapper">
            <div id="content">
                <div th:replace="~{fragment2 ::adminfragment2}"></div>
                <div class="container-fluid">
                    <h3 class="text-dark mb-4">Product Info</h3>
                    <div class="card shadow">
                        <div class="card-header py-3">
                            <div>
                                <p class="text-primary m-0 fw-bold" style="width: 300px;">Old Battery Selling Report</p>
                            </div>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 text-nowrap">

                                <div class="col-md-6">
                                    <div class="text-md-end dataTables_filter" id="dataTable_filter"><label class="form-label"><input type="search" class="form-control form-control-sm" aria-controls="dataTable" id="tSearch" oninput="filterTbl()" placeholder="Search"></label></div>
                                </div>
                            </div>
                            <div class="table-responsive table mt-2" id="dataTable" role="grid" aria-describedby="dataTable_info">
                                <table class="table my-0" id="dataTable1">
                                    <thead>
                                        <tr>
                                            <th class="text-center">Oder Id</th>
                                            <th class="text-center">Old Battery Weight</th>
                                            <th class="text-center">Old Battery Rate</th>
                                            <th class="text-center">Customer name</th>
                                            <th class="text-center">Invoice Date</th>

                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="invoice : ${invoiceList}">
                                            <td th:text="${invoice.id}" class="text-center">#1234</td>
                                            <td th:text="${invoice.OldWight}+' KG'" class="text-center">Gurudam Sharma</td>
                                            <td th:text="${invoice.OldRate}" class="text-center">B wing 405 rameshwar aprtment corlim goa</td>
                                            <td th:text="${invoice.userName}" class="text-center">9422195877</td>
                                            <td th:text="${invoice.invoiceDate}" class="text-center"> 2008/11/28</td>

                                        </tr>
                                    </tbody>
                                    <tfoot>

                                    </tfoot>
                                </table>
                            </div>
                            <div class="row">
                                <span th:text="${page}"></span>
                                <div class="col-md-6">
                                    <nav class="d-lg justify-content-lg-end dataTables_paginate paging_simple_numbers">
                                        <ul class="pagination">
                                            <!-- Previous Button -->
                                            <li class="page-item" th:classappend="${curPage == 1} ? 'disabled'">
                                                <a class="page-link" aria-label="Previous"
                                                   th:href="@{/admin/old-battery/report/(curPage=${curPage - 1})}">
                                                    <span aria-hidden="true">«</span>
                                                </a>
                                            </li>

                                            <!-- Page Numbers -->
                                            <li class="page-item"
                                                th:classappend="${pageNo == curPage} ? 'active' : ''"
                                                th:each="pageNo : ${#numbers.sequence(1, totalPages)}">
                                                <a class="page-link"
                                                   th:href="@{/admin/old-battery/report/(curPage=${pageNo})}"
                                                   th:text="${pageNo}"></a>
                                            </li>

                                            <!-- Next Button -->
                                            <li class="page-item" th:classappend="${curPage == totalPages} ? 'disabled'">
                                                <a class="page-link" aria-label="Next"
                                                   th:href="@{/admin/old-battery/report/(curPage=${curPage + 1})}">
                                                    <span aria-hidden="true">»</span>
                                                </a>
                                            </li>
                                        </ul>
                                    </nav>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal fade" role="dialog" tabindex="-1" id="modal-1">
                    <div class="modal-dialog" role="document">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h4 class="modal-title"></h4><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <p>The content of your modal.</p>
                            </div>
                            <div class="modal-footer"><button class="btn btn-light" type="button" data-bs-dismiss="modal">Close</button><button class="btn btn-primary" type="button">Save</button></div>
                        </div>
                    </div>
                </div>
            </div>
            <footer class="bg-white sticky-footer"></footer>
        </div><a class="border rounded d-inline scroll-to-top" href="#page-top"><i class="fas fa-angle-up"></i></a>
    </div>
    <script src="/assestad/bootstrap/js/bootstrap.min.js"></script>
    <script src="/assestad/js/bs-init.js"></script>
    <script src="/assestad/js/Billing-Table-with-Add-Row--Fixed-Header-Feature-Billing-Table-with-Add-Row--Fixed-Header.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="/assestad/js/theme.js"></script>
</body>

</html>
