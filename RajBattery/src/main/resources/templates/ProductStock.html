<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Raj Electric | Product Stock Update</title>

    <!-- ✅ Bootstrap -->
    <link rel="stylesheet" href="/assestad/bootstrap/css/bootstrap.min.css">

    <!-- ✅ Fonts & Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,300,400,600,700,800,900&display=swap">
    <link rel="stylesheet" href="/assestad/fonts/fontawesome-all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- ✅ Custom CSS -->
    <link rel="stylesheet" href="/assestad/css/Billing-Table-with-Add-Row--Fixed-Header-Feature.css">
    <link rel="stylesheet" href="/assestad/css/Company-Invoice.css">
    <link rel="stylesheet" href="/assestad/css/Ludens---Create-Edit-Form.css">
    <link rel="stylesheet" href="/assestad/css/Pretty-Login-Form-.css">
    <link rel="stylesheet" href="/assestad/css/select.css">

    <!-- ✅ jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- ✅ Select2 -->
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.full.min.js"></script>

    <!-- ✅ Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- ✅ SweetAlert -->
<!--    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>-->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


    <!-- ✅ Custom JS -->
    <script src="/assestad/js/searchProduct.js"></script>
    <script src="/assestad/js/Manipulation.js"></script>
</head>

<body id="page-top">

<!-- ✅ SweetAlert Integration -->
<script th:inline="javascript">
    let msg = [[${msg}]];
    let emsg = [[${emsg}]];

    if (msg != null) {
        Swal.fire({
            toast: true,
            position: 'top-end',   // TOP RIGHT
            icon: 'success',
            title: msg,
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true
        });
    }

    if (emsg != null) {
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'error',
            title: emsg,
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true
        });
    }
</script>


<div id="wrapper">
    <div th:replace="~{fragment1 ::adminfragment1}"></div>
    <div class="d-flex flex-column" id="content-wrapper">
        <div id="content">
            <div th:replace="~{fragment2 ::adminfragment2}"></div>

            <div class="container-fluid">
                <h3 class="text-dark mb-4">Product Info</h3>
                <div class="card shadow"></div>
            </div>

            <div class="container">
                <div style="color: rgb(133,135,150); min-height: 600px;">
                    <section>
                        <div class="container">
                            <div class="row mt-4">
                                <div class="col">
                                    <div class="row login-form">
                                        <div class="col-md-4 offset-md-4">
                                            <h2 class="text-center form-heading">Update Product Stock</h2>

                                            <!-- ✅ Product Stock Form -->
                                            <form class="custom-form" method="post" action="/admin/product-stock/update/" th:object="${ProductStock}">

                                                <!-- Product Category -->
                                                <div class="form-group mb-3">
                                                    <label class="form-label mb-0">Select Product Category</label>
                                                    <select class="form-select" id="prodCategory">
                                                        <option value="" selected disabled>Select Category</option>
                                                        <option th:each="category : ${categoryList}"
                                                                th:value="${category.id}"
                                                                th:text="${category.cate}">
                                                        </option>
                                                    </select>
                                                </div>

                                                <!-- Product Dropdown -->
                                                <div class="form-group mb-3">
                                                    <label class="form-label mb-0">Select Product Name</label>
                                                    <select id="productSelect" name="productSelect" style="width:100%"></select>
                                                </div>

                                                <!-- Product Quantity -->
                                                <div class="form-group mb-3">
                                                    <label class="form-label mb-0">Enter Product Qty</label>
                                                    <input id="qtyValue" class="form-control" type="number" name="recStock" placeholder="Qty" value="1">
                                                </div>

                                                <!-- Note -->
                                                <div class="form-group mb-3">
                                                    <label class="form-label mb-0">Enter Any Note</label>
                                                    <input class="form-control" type="text" name="note" placeholder="Stock adjustment note e.g. opening stock">
                                                </div>

                                                <button class="btn btn-success d-block submit-button w-100" type="submit">Update Qty</button>
                                            </form>
                                            <!-- End Form -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>
            </div>
        </div>
    </div>
    <a class="border rounded d-inline scroll-to-top" href="#page-top"><i class="fas fa-angle-up"></i></a>
</div>

<!-- ✅ Bootstrap Bundle -->
<script src="/assestad/bootstrap/js/bootstrap.bundle.min.js"></script>

<!-- ✅ Select2 + Logic -->
<script>
$(document).ready(function () {
    if (typeof $.fn.select2 !== "function") {
        console.error("❌ Select2 not loaded properly!");
        return;
    }

    console.log("✅ Initializing Select2...");
    $('#productSelect').select2({
        placeholder: "Search for a product...",
        ajax: {
            url: '/api/products/search',
            dataType: 'json',
            delay: 250,
            data: function (params) {
                return { query: params.term };
            },
            processResults: function (data) {
                return {
                    results: data.map(p => ({
                        id: p.id,
                        text: p.name
                    }))
                };
            },
            cache: true
        },
        minimumInputLength: 1,
        width: '100%'
    });

    // ✅ Reset product dropdown when category changes
    $('#prodCategory').on('change', function () {
        $('#productSelect').val(null).trigger('change');
    });
});
</script>

</body>
</html>
