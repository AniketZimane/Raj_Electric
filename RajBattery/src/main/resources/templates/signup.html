<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Sign up - Brand</title>
    <link rel="stylesheet" href="/user_assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,900">
    <link rel="stylesheet" href="/user_assets/css/Card-Store.css">
    <link rel="stylesheet" href="/user_assets/css/Company-Invoice.css">
    <link rel="stylesheet" href="/user_assets/css/Ludens---Create-Edit-Form.css">
    <link rel="stylesheet" href="/user_assets/css/Pretty-Login-Form-.css">
    <link rel="stylesheet" href="/user_assets/css/select.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>
    <script src="/assestad/js/clock.js"></script>
</head>

<body>
<script th:inline="javascript">
       var msg=[[${msg}]]
       var emsg=[[${emsg}]]
       if(msg!=null)
       {
               swal("Good job!", msg, "success");
        }
        if(emsg!=null)
        {
               swal("Opps!", emsg, "info");

        }
</script>

    <section class="py-4 py-md-5 my-5">
        <div class="container py-md-5">
            <div class="row">
                <div class="col-md-6 text-center"><img class="img-fluid w-100" src="/user_assets/img/illustrations/register.svg"></div>
                <div class="col-md-5 col-xl-4 text-center text-md-start">
                    <h2 class="display-6 fw-bold mb-5"><span class="underline pb-1"><strong>Sign up</strong></span></h2>
                    <form method="post" action="/user/register/" object="${Registration}">
                        <div class="mb-3"><input class="shadow-sm form-control" type="text" name="username" placeholder="Name"></div>
                        <div class="mb-3"><input class="shadow-sm form-control" type="email" name="email" placeholder="Email">
<!--                            <div class="d-lg-flex justify-content-lg-center" style="padding-top: 10px;">-->
<!--                                <button class="btn btn-success" type="button" style="border-radius: 20px;">Send OTP</button></div>-->
<!--                        </div>-->
<!--                        <div class="mb-3"><input class="shadow-sm form-control" type="number" name="otp" placeholder="Enter Otp">-->
<!--                            <div class="d-lg-flex justify-content-lg-center align-items-lg-center" style="padding-top: 10px;"><button class="btn btn-success" type="button" style="border-radius: 20px;">Verify</button></div>-->
<!--                        </div>-->

                        <div class="mb-3"><input class="shadow-sm form-control" type="number" name="mobNo" placeholder="Mobile Number"></div>
                        <div class="mb-3"><input class="shadow-sm form-control" type="password" name="password" placeholder="Password"></div>
                        <div class="mb-3"><input class="shadow-sm form-control" type="password" name="password_repeat" placeholder="Repeat Password"></div>
                        <div class="mb-5"><button class="btn btn-primary shadow" type="submit">Create account</button></div>
                        <p class="text-muted">Have an account? <a href="/login">Log in&nbsp;<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icon-tabler-arrow-narrow-right">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                    <line x1="15" y1="16" x2="19" y2="12"></line>
                                    <line x1="15" y1="8" x2="19" y2="12"></line>
                                </svg></a>&nbsp;</p>
                    </form>
                </div>
            </div>
        </div>
    </section>
    <footer></footer>
    <script src="/user_assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="/user_assets/js/bs-init.js"></script>
    <script src="/user_assets/js/startup-modern.js"></script>
</body>

</html>
