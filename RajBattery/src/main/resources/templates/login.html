    <section class="py-4 py-md-5 my-5">
        <div class="container py-md-5">
            <div class="row">
                <div class="col-md-6 text-center"><img class="img-fluid w-100" src="/user_assets/img/illustrations/login.svg"></div>
                <div class="col-md-5 col-xl-4 text-center text-md-start">
                    <h2 class="display-6 fw-bold mb-5"><span class="underline pb-1"><strong>Login</strong><br></span></h2>

                        <div class="mb-3"><input class="shadow form-control" type="email" name="email" placeholder="Email"></div>

    <div class="modal fade" role="dialog" tabindex="-1" id="modal-1">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h4 class="modal-title">Reset Password</h4><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>The content of your modal.</p>
                    <div class="col-md-5 col-xl-4 text-center text-md-start" style="width: 300px;">
                        <h2 class="display-6 fw-bold mb-5"><span class="underline pb-1"></span></h2>
                        <form method="post" style="width: 400px;">
                            <div class="mb-3"><input class="shadow form-control" type="email" name="email" placeholder="Email">
                                <div class="d-lg-flex justify-content-lg-center"><button class="btn btn-secondary shadow" type="button" style="margin-top: 11px;border-radius: 10px;--bs-success: #0ed793;--bs-success-rgb: 14,215,147;background: var(--bs-green);border-color: var(--bs-btn-hover-border-color);color: var(--bs-btn-color);text-align: center;">Send Otp</button><button class="btn btn-success shadow" type="button" style="margin-top: 11px;border-radius: 10px;--bs-success: #0ed793;--bs-success-rgb: 14,215,147;background: var(--bs-green);border-color: var(--bs-btn-hover-border-color);color: var(--bs-btn-active-border-color);text-align: center;margin-left: 10px;"><svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" fill="currentColor" viewBox="0 0 16 16" class="bi bi-arrow-counterclockwise" style="color: var(--bs-black);">
                                            <path fill-rule="evenodd" d="M8 3a5 5 0 1 1-4.546 2.914.5.5 0 0 0-.908-.417A6 6 0 1 0 8 2v1z"></path>
                                            <path d="M8 4.466V.534a.25.25 0 0 0-.41-.192L5.23 2.308a.25.25 0 0 0 0 .384l2.36 1.966A.25.25 0 0 0 8 4.466z"></path>
                                        </svg></button></div>
                            </div>
                            <div class="mb-3"><input class="shadow form-control" type="email" name="email" placeholder="Enter Otp"></div>
                            <div class="d-lg-flex justify-content-lg-center" style="padding-bottom: 10px;"><button class="btn btn-secondary shadow" type="button" style="margin-top: 11px;border-radius: 10px;--bs-success: #0ed793;--bs-success-rgb: 14,215,147;background: var(--bs-green);border-color: var(--bs-btn-hover-border-color);color: var(--bs-black);text-align: center;">Send Otp</button></div>
                            <div class="mb-3"><input class="shadow form-control" type="password" name="password" placeholder="Password"></div>
                            <div class="mb-3"><input class="shadow form-control" type="password" name="rePassword" placeholder="Re Enter Password"></div>
                            <div class="mb-5"><button class="btn btn-primary shadow" type="submit" style="border-radius: 10px;">Update</button></div>
                            <p class="text-muted"><a href="forgotten-password.html" data-bs-target="#modal-1" data-bs-toggle="modal">Did You Remember Password?</a></p>
                        </form>
                    </div>
                </div>
