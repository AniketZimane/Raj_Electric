    <!-- ✅ Select2 + Product Search Logic -->
    <script>
$('#productSelect').on('change', function () {
    const productId = $(this).val();
    if (!productId) return;

    axios.get(`/api/products/${productId}`)
        .then(response => {
            const product = response.data;
            console.log(product);
            $('#rate').val(product.prize);

            const qty = parseFloat($('#qtyValue').val()) || 1;
            $('#totalAmt').val(product.price * qty);  // FIXED HERE
        })
        .catch(error => {
            console.error("Error fetching product details:", error);
        });
});

// Qty change calculation
$('#qtyValue').on('input', function () {
    const rate = parseFloat($('#rate').val()) || 0;
    const qty = parseFloat($(this).val()) || 1;

    $('#totalAmt').val(rate * qty);
});

</script>
