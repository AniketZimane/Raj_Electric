<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Home - Brand</title>
    <link rel="stylesheet" href="/user_assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway:300italic,400italic,600italic,700italic,800italic,400,300,600,700,800&amp;display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600,700,900">
    <link rel="stylesheet" href="/user_assets/fonts/fontawesome-all.min.css">
    <link rel="stylesheet" href="/user_assets/fonts/font-awesome.min.css">
    <link rel="stylesheet" href="/user_assets/fonts/fontawesome5-overrides.min.css">
    <link rel="stylesheet" href="/user_assets/css/Card-Store.css">
    <link rel="stylesheet" href="/user_assets/css/Company-Invoice.css">
    <link rel="stylesheet" href="/user_assets/css/Ludens---Create-Edit-Form.css">
    <link rel="stylesheet" href="/user_assets/css/Pretty-Login-Form-.css">
    <link rel="stylesheet" href="/user_assets/css/select.css">
</head>

<body>
<div th:replace="userFragment.html ::userFragment1"></div>
    <header class="pt-5">
        <div class="container pt-4 pt-xl-5">
            <div class="row pt-5">
                <div class="col-md-8 text-center text-md-start mx-auto">
                    <div class="text-center">
                        <h1 class="display-4 fw-bold mb-5"><span class="underline">Raliable</span>&nbsp;Power Solutions for a Brighter Future.</h1>
                    </div>
                </div>
                <div class="col-12 col-lg-10 mx-auto">
                    <div class="text-center position-relative"></div>
                </div>
            </div>
        </div>
    </header>
    <section></section>
    <section class="py-4 py-xl-5">
        <div class="container">
            <div class="bg-primary border rounded border-0 border-primary overflow-hidden"></div>
        </div>
    </section>
    <section class="py-5"></section>
    <section class="py-4 py-xl-5 mb-5">
        <div class="container">
            <div style="color: rgb(133,135,150);height: 600px;">
                <h2 class="text-center" style="color: rgb(133,135,150);">Customer Details</h2>
                <p class="text-center">Thank You For become a part of our Businesss</p>
                <form class="shadow align-content-center form-topborder" style="text-align: left;background: #ffffff;padding: 20px;">
                    <div class="row">
                        <div class="col-12 col-sm-12 col-md-6 col-lg-3" style="margin-top: 12px;"><label class="form-label fw-bold">Order Id*</label><select class="form-select" disabled="">
                                <option value="1" selected>Select Order Id</option>
                                <option value="1">1</option>
                                <option value="0">105</option>
                            </select></div>
                        <div class="col-12 col-sm-12 col-md-6 col-lg-3 col-xl-3" style="margin-top: 12px;"><label class="form-label fw-bold">Customer Name*</label><input class="form-control" type="text" name="name" placeholder="Enter Your Name"></div>
                        <div class="col-12 col-sm-12 col-md-6 col-lg-3 col-xl-3" style="margin-top: 12px;"><label class="form-label fw-bold">Mobile Number*</label><input class="form-control" type="text" placeholder="+911234567890" name="mobNo"></div>
                        <div class="col-12 col-md-6 col-lg-3 order-4" style="margin-top: 12px;"><label class="form-label fw-bold">Email Id*</label><input class="form-control" type="text" placeholder="abc123@gmail.com" name="emailid"></div>
                        <div class="col-12 col-md-6 col-lg-3 order-4" style="margin-top: 12px;"><label class="form-label fw-bold">Pin Code</label><input class="form-control" type="number" placeholder="0" name="zipCode"></div>
                        <div class="col-12 col-md-6 col-lg-3 order-4" style="margin-top: 12px;"><label class="form-label fw-bold">Enter Pin Code*</label><input class="form-control" type="text" placeholder="123456" name="zipCode"></div>
                        <div class="col-12 col-md-6 col-lg-3 order-4" style="margin-top: 12px;"><label class="form-label fw-bold">Country*</label><input class="form-control" type="text" placeholder="Asunto" value="India" name="country"></div>
                        <div class="col-12 col-md-6 col-lg-3 order-4" style="margin-top: 12px;"><label class="form-label fw-bold">State*</label><input class="form-control" type="text" placeholder="Enter State" name="state"></div>
                        <div class="col-12 col-md-6 col-lg-3 order-4" style="margin-top: 12px;"><label class="form-label fw-bold">District*</label><input class="form-control" type="text" placeholder="Enter your district" name="district"></div>
                        <div class="col-12 col-md-6 col-lg-3 order-4" style="margin-top: 12px;"><label class="form-label fw-bold">Taluka*</label><input class="form-control" type="text" placeholder="Enter Taluka" name="taluka"></div>
                        <div class="col-12 col-md-6 col-lg-3 order-4" style="margin-top: 12px;"><label class="form-label fw-bold">Payment Mode*</label><select class="form-select">
                                <option value="1" selected="">Online</option>
                                <option value="0">Cash On Delivery</option>
                                <option value="3">EMI</option>
                            </select></div>
                        <div class="col-12 col-md-6 col-lg-3 order-4" style="margin-top: 12px;"><label class="form-label fw-bold">Is Residential and Office Address Same&nbsp;</label>
                            <div class="form-check"><input class="form-check-input" type="radio" id="formCheck-2" name="answer"><label class="form-check-label" for="formCheck-2">Yes</label></div>
                            <div class="form-check"><input class="form-check-input" type="radio" id="formCheck-3" name="answer"><label class="form-check-label" for="formCheck-3">No</label></div>
                        </div>
                        <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 order-4" style="margin-top: 12px;"><label class="form-label fw-bold">Home Address</label><textarea class="form-control" placeholder="Address"></textarea>
                            <hr class="my-4">
                        </div>
                        <div class="col-12 col-sm-12 col-md-12 col-lg-12 col-xl-12 order-4" style="margin-top: 12px;"><label class="form-label fw-bold">Office Address</label><textarea class="form-control" placeholder="Address"></textarea>
                            <hr class="my-4">
                        </div>
                    </div>
                    <hr>
                    <div class="mt-4 mt-lg-4 my-4"><button class="btn btn-primary col-xl-12 btn-guardar col-sm-12 col-12" type="button"><i class="fa fa-save mx-3"></i>&nbsp;Place Order</button><button class="btn btn-primary col-xl-12 mt-2 btn-limpiar col-sm-12 col-12" type="button"><i class="fas fa-broom mx-3"></i>Clear</button><button class="btn btn-primary col-xl-12 mt-2 btn-cancelar col-sm-12 col-12" type="button"><i class="fas fa-arrow-left mx-3"></i>Cancel Order&nbsp;</button></div>
                </form>
            </div>
        </div>
    </section>
    <section class="py-4 py-xl-5"></section>
    <footer></footer>
    <script src="/user_assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="/user_assets/js/bs-init.js"></script>
    <script src="/user_assets/js/startup-modern.js"></script>
</body>

</html>
