<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Invoice</title>

    <link rel="stylesheet" href="/assestad/bootstrap/css/bootstrap.min.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>

/* A4 Layout */
#invoice-wrapper {
    width: 210mm;
    min-height: 297mm;
    margin: auto;
    padding: 15mm;
    background: white;
    box-sizing: border-box;
    position: relative;
}

/* Watermark */
#invoice-wrapper::before {
    content: "";
    position: absolute;
    inset: 0;
    background: url('/assestad/img/logo.jpeg') no-repeat center;
    background-size: 300px;
    opacity: 0.07;
    z-index: 0;
}

/* Keep content above */
#invoice-content {
    position: relative;
    z-index: 2;
}

/* Header */
.company-name {
    font-size: 34px;
    font-weight: 900;
    text-transform: uppercase;
    color: #000;
}

/* Table */
.invoice-table {
    border: 2px solid #000;
    width: 100%;
    font-size: 14px;
}

.invoice-table th,
.invoice-table td {
    border: 1px solid #000;
    padding: 6px;
}

.invoice-table th {
    background: #f2f2f2;
}

/* Prevent cuts */
.invoice-table tr {
    page-break-inside: avoid;
}

</style>

</head>

<body>


<div class="container mt-3 text-center">

    <button class="btn btn-primary mb-3" onclick="generatePDF()">
        <i class="fa fa-print"></i> Print Invoice
    </button>

</div>


<!-- ================= INVOICE ================= -->

<div id="invoice-wrapper">

    <div id="invoice-content">


        <!-- HEADER -->

        <div class="text-center mb-3">

            <h1 class="company-name" th:text="${Cname}">
                GURU HARDWARE
            </h1>

            <div th:text="${Cadd}"></div>

            <div>📞 <span th:text="${Cnumber}"></span></div>

            <hr>

        </div>


        <!-- CUSTOMER -->

        <div class="row mb-3">

            <div class="col-6">

                <b>To:</b> <span th:text="${username}"></span><br>
                <span th:text="${address}"></span><br>
                📞 <span th:text="${mobNumber}"></span>

            </div>


            <div class="col-6 text-end">

                ID: <b th:text="${id}"></b><br>
                Date: <b th:text="${invoiceDate}"></b><br>
                Status: <b th:text="${paymentStatus}"></b><br>
                Vehicle: <b th:text="${vehicle}"></b>

            </div>

        </div>


        <!-- TABLE -->

        <table class="invoice-table">

            <thead>
            <tr>
                <th>#</th>
                <th>Item</th>
                <th>Qty</th>
                <th>Unit</th>
                <th>Amount</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="data,i:${extractData}">

                <td th:text="${i.index+1}"></td>

                <td th:text="${data.Prod_Name}"></td>

                <td th:text="${data.qty}"></td>

                <td>Nos</td>

                <td th:text="${data.amount}"></td>

            </tr>

            </tbody>


            <tfoot>

            <tr>
                <td colspan="3" class="text-center"><b>Total</b></td>
                <td></td>
                <td th:text="${netAmt}"></td>
            </tr>

            </tfoot>

        </table>


        <!-- TOTALS -->

        <div class="row justify-content-end mt-3">

            <div class="col-5">

                <div class="d-flex justify-content-between">
                    <span>Sub Total</span>
                    <span th:text="${grossAmount}"></span>
                </div>

                <div class="d-flex justify-content-between">
                    <span>Total</span>
                    <span th:text="${netAmt}"></span>
                </div>

                <div class="d-flex justify-content-between">
                    <span>Payment</span>
                    <span th:text="${paymentMode}"></span>
                </div>

                <div class="d-flex justify-content-between">
                    <span>Paid</span>
                    <span th:text="${paidAmount}"></span>
                </div>

                <div class="d-flex justify-content-between">
                    <span>Remaining</span>
                    <span th:text="${netAmt-paidAmount}"></span>
                </div>

            </div>

        </div>


        <hr>


        <!-- FOOTER -->

        <div class="text-center mt-4">

            <h5>Thank you for visiting 🙏</h5>

        </div>


    </div>
</div>



<!-- SCRIPT -->

<script>
function generatePDF() {

    const element = document.getElementById("invoice-wrapper");

    const opt = {

        margin: 0,

        filename: "invoice_" + Date.now() + ".pdf",

        image: {
            type: "jpeg",
            quality: 0.98
        },

        html2canvas: {
            scale: 2,
            useCORS: true
        },

        jsPDF: {
            unit: "mm",
            format: "a4",
            orientation: "portrait"
        },

        pagebreak: {
            mode: "avoid-all"
        }
    };

    html2pdf().set(opt).from(element).save();
}
</script>


</body>
</html>
