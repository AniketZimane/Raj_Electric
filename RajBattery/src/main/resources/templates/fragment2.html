<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Topbar</title>
</head>
<body>
<div th:fragment="adminfragment2">
<style>
    .topbar {
        background: #fff;
        border-bottom: 1px solid #e4e7ef;
        padding: .6rem 1.5rem;
        display: flex; align-items: center; justify-content: space-between;
        position: sticky; top: 0; z-index: 99;
        box-shadow: 0 1px 6px rgba(0,0,0,.05);
    }
    .topbar-mobile-toggle {
        display: none; align-items: center; justify-content: center;
        width: 36px; height: 36px; border-radius: 8px;
        background: #f0f2f8; border: none; cursor: pointer; color: #0d1b4b;
    }
    @media (max-width: 768px) { .topbar-mobile-toggle { display: flex; } }
    .topbar-left { display: flex; align-items: center; gap: .75rem; }
    .topbar-breadcrumb { font-size: .78rem; color: #8a94a6; font-weight: 600; }
    .topbar-breadcrumb span { color: #0d1b4b; }
    .topbar-right { display: flex; align-items: center; gap: .5rem; }
    .topbar-icon-btn {
        width: 36px; height: 36px; border-radius: 8px;
        background: #f0f2f8 !important; border: none !important;
        box-shadow: none !important; outline: none !important;
        cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        color: #0d1b4b; transition: background .18s; text-decoration: none;
        padding: 0; line-height: 1;
    }
    .topbar-icon-btn:hover { background: #e4e7ef !important; color: #0d1b4b; }
    .topbar-divider { width: 1px; height: 28px; background: #e4e7ef; margin: 0 .25rem; }
    .topbar-user {
        display: flex; align-items: center; gap: .6rem;
        padding: .35rem .75rem; border-radius: 10px;
        cursor: pointer; transition: background .18s;
        text-decoration: none; color: #0d1b4b;
        border: none !important; background: transparent !important;
        box-shadow: none !important; outline: none !important;
    }
    .topbar-user:hover { background: #f0f2f8 !important; }
    .topbar-avatar {
        width: 32px; height: 32px; border-radius: 50%;
        background: linear-gradient(135deg, #0d1b4b, #3949ab);
        display: flex; align-items: center; justify-content: center;
        color: #fff; font-size: .75rem; font-weight: 800; flex-shrink: 0;
    }
    .topbar-username { font-size: .82rem; font-weight: 700; color: #0d1b4b; }
    .topbar-role     { font-size: .65rem; color: #8a94a6; font-weight: 600; }
    .topbar-dropdown {
        position: absolute; top: calc(100% + 8px); right: 0;
        background: #fff; border: 1.5px solid #e4e7ef; border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0,0,0,.1); min-width: 180px;
        padding: .4rem; z-index: 999; display: none;
    }
    .topbar-dropdown.show { display: block; }
    .topbar-dropdown a {
        display: flex; align-items: center; gap: .6rem;
        padding: .5rem .75rem; border-radius: 8px;
        font-size: .82rem; font-weight: 600; color: #374151;
        text-decoration: none; transition: background .15s;
    }
    .topbar-dropdown a:hover { background: #f0f2f8; color: #0d1b4b; }
    .topbar-dropdown .dd-divider { border-top: 1px solid #e4e7ef; margin: .3rem 0; }
    .topbar-dropdown .dd-logout { color: #dc2626; }
    .topbar-dropdown .dd-logout:hover { background: #fee2e2; }
    .topbar-user-wrap { position: relative; }
</style>
    <div class="topbar">
        <div class="topbar-left">
            <button class="topbar-mobile-toggle" onclick="document.getElementById('sidebar').classList.toggle('collapsed')">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/>
                </svg>
            </button>
            <div class="topbar-breadcrumb">
                ERP &rsaquo; <span id="topbar-page-title">Dashboard</span>
            </div>
        </div>

        <div class="topbar-right">
            <a class="topbar-icon-btn" href="/admin/dashboard/" title="Dashboard">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/>
                </svg>
            </a>
            <a class="topbar-icon-btn" href="/admin/inhouse/invoice/" title="New Invoice">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                </svg>
            </a>
            <div class="topbar-divider"></div>
            <div class="topbar-user-wrap">
                <button class="topbar-user" id="userDropBtn" onclick="toggleUserDrop()">
                    <div class="topbar-avatar" id="topbar-avatar-initials">A</div>
                    <div>
                        <div class="topbar-username" th:text="${logedUserName != null ? logedUserName : 'Admin'}">Admin</div>
                        <div class="topbar-role">Administrator</div>
                    </div>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="#8a94a6" style="margin-left:.25rem;">
                        <path d="M7 10l5 5 5-5z"/>
                    </svg>
                </button>
                <div class="topbar-dropdown" id="userDropMenu">
                    <a href="/admin/dashboard/">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                        Dashboard
                    </a>
                    <a href="/company/">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                        Settings
                    </a>
                    <div class="dd-divider"></div>
                    <a href="/logout" class="dd-logout">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>
                        Logout
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleUserDrop() {
            document.getElementById('userDropMenu').classList.toggle('show');
        }
        document.addEventListener('click', function(e) {
            const wrap = document.querySelector('.topbar-user-wrap');
            if (wrap && !wrap.contains(e.target)) {
                document.getElementById('userDropMenu').classList.remove('show');
            }
        });
        (function() {
            const t = document.title;
            const el = document.getElementById('topbar-page-title');
            if (el && t) el.textContent = t.split('—')[0].trim();
        })();
        (function() {
            const nameEl = document.querySelector('.topbar-username');
            const avatarEl = document.getElementById('topbar-avatar-initials');
            if (nameEl && avatarEl) {
                const name = nameEl.textContent.trim();
                avatarEl.textContent = name ? name.charAt(0).toUpperCase() : 'A';
            }
        })();
    </script>
</div>
</body>
</html>
