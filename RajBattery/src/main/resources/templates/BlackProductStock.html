<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Raj Electric | Product Stock Update</title>
    <link rel="stylesheet" href="/assestad/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i&amp;display=swap">
    <link rel="stylesheet" href="/assestad/fonts/fontawesome-all.min.css">
    <link rel="stylesheet" href="/assestad/css/Billing-Table-with-Add-Row--Fixed-Header-Feature.css">
    <link rel="stylesheet" href="/assestad/css/Company-Invoice.css">
    <link rel="stylesheet" href="/assestad/css/Ludens---Create-Edit-Form.css">
    <link rel="stylesheet" href="/assestad/css/Pretty-Login-Form-.css">
    <link rel="stylesheet" href="/assestad/css/select.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.4.0/jspdf.umd.min.js"></script>
    <script src="/assestad/js/Manipulation.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

</head>

<body id="page-top">
<script th:inline="javascript">
       var msg=[[${msg}]]
       var emsg=[[${emsg}]]
       if(msg!=null)
       {
               swal("Good job!", msg, "success");
        }
        if(emsg!=null)
        {
               swal("Opps!", emsg, "info");

        }
</script>
    <div id="wrapper">
        <div th:replace="~{fragment1 ::adminfragment1}"></div>
        <div class="d-flex flex-column" id="content-wrapper">
            <div id="content">
                <div th:replace="~{fragment2 ::adminfragment2}"></div>
                <div class="container-fluid">
                    <h3 class="text-dark mb-4">Product Info</h3>
                    <div class="card shadow"></div>
                </div>
                <div class="container">
                    <div style="color: rgb(133,135,150);height: 600px;">
                        <section>
                            <div class="container">
                                <div class="row mt-4">
                                    <div class="col">
                                        <div class="row login-form">
                                            <div class="col-md-4 offset-md-4">
                                                <h2 class="text-center form-heading">Update Product Stock</h2>
                                                <form class="custom-form" method="post" action="/admin/black-product-stock/update/" th:object="${BlackStock}">
                                                    <div class="form-group mb-3">
                                                            <div class="field">
                                                                <label class="form-label mb-0" >Select Product Category</label>
                                                                <select class="form-select" id="prodCategory">
                                                                    <option value="" selected disabled>Select Category</option>
                                                                    <option th:each="category : ${categoryList}"
                                                                            th:value="${category.id}"
                                                                            th:text="${category.cate}">
                                                                    </option>

                                                                </select>
                                                                <div class="field">
                                                                    <label class="form-label mb-0" >Select Product Name</label>
                                                                    <select class="form-select" id="productId" name="productSelect">
                                                                        <optgroup label="This is a group">
                                                                            <option value="12" selected="">This is item 1</option>
                                                                            <option value="13">This is item 2</option>
                                                                            <option value="14">This is item 3</option>
                                                                        </optgroup>
                                                                    </select></div>
                                                            </div>
                                                            <div class="field"><label class="form-label mb-0" >Enter Product Qty</label><input class="form-control" type="number" name="recStock" placeholder="Qty"></div>
                                                            <div class="field"><label class="form-label mb-0" >Enter Any Note</label><input class="form-control" type="text" name="note" placeholder="Stock adjustment note e.g opening stock"></div>

                                                    </div><button class="btn btn-success d-block submit-button w-100" type="submit">Update Qty</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div><a class="border rounded d-inline scroll-to-top" href="#page-top"><i class="fas fa-angle-up"></i></a>
    </div>
    <script src="/assestad/bootstrap/js/bootstrap.min.js"></script>
    <script src="/assestad/js/bs-init.js"></script>
    <script src="/assestad/js/Billing-Table-with-Add-Row--Fixed-Header-Feature-Billing-Table-with-Add-Row--Fixed-Header.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="/assestad/js/theme.js"></script>
</body>

</html>
